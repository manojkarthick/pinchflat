name: Docker Custom Branch

on:
  workflow_dispatch:
    inputs:
      platforms:
        type: choice
        description: Build platforms (multi-arch so Apple Silicon can pull :custom)
        required: true
        default: linux/amd64,linux/arm64
        options:
          - linux/amd64,linux/arm64
          - linux/amd64
          - linux/arm64
      docker_tags:
        type: string
        description: Primary image tag (sha tag is always added)
        required: true
        default: custom
  push:
    branches:
      - custom

concurrency:
  group: docker-custom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_push_docker:
    runs-on: ubuntu-latest
    env:
      # Manifest list must include arm64 for docker pull on Apple Silicon / ARM servers
      dev_arch: linux/amd64,linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=custom,enable=${{ github.event_name == 'push' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ inputs.docker_tags }},enable=${{ github.event_name == 'workflow_dispatch' }}
          flavor: |
            latest=false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/selfhosted.Dockerfile
          platforms: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || env.dev_arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
