# Multi-arch image without QEMU for arm64: Deno (runner stage) crashes under QEMU
# (SIGILL). Build each arch on a native runner, then merge manifests.
# Requires a public repo for ubuntu-24.04-arm (free tier); private forks need larger arm runners.

name: Docker Custom Branch

on:
  workflow_dispatch:
    inputs:
      docker_tags:
        type: string
        description: Extra tag for merged image (in addition to custom and sha-)
        required: false
        default: ""
  push:
    branches:
      - custom

concurrency:
  group: docker-custom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (single-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/selfhosted.Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository }}:arch-${{ github.sha }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=custom-${{ matrix.suffix }}
          cache-to: type=gha,scope=custom-${{ matrix.suffix }},mode=max

  merge_manifests:
    runs-on: ubuntu-latest
    needs: [build_platform]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          set -eux
          IMAGE="ghcr.io/${{ github.repository }}"
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:7}"
          SRC_AMD="${IMAGE}:arch-${SHA}-amd64"
          SRC_ARM="${IMAGE}:arch-${SHA}-arm64"
          EXTRA="${{ inputs.docker_tags }}"
          TAGS="-t ${IMAGE}:custom -t ${IMAGE}:sha-${SHORT}"
          if [ -n "${EXTRA}" ]; then
            TAGS="${TAGS} -t ${IMAGE}:${EXTRA}"
          fi
          docker buildx imagetools create ${TAGS} "${SRC_AMD}" "${SRC_ARM}"
